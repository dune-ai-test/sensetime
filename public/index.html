<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nova Images · SenseNova image generation</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel2: #171b26;
    --line: #232939;
    --text: #e8ecf4;
    --muted: #8b93a7;
    --accent: #6d8dff;
    --accent2: #9a6dff;
    --danger: #ff6d7a;
    --ok: #4ade9d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #1b2140 0%, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.55 system-ui, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 22px 28px;
  }
  .logo {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff;
  }
  header h1 { font-size: 19px; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 13px; }
  main {
    display: grid; grid-template-columns: 380px 1fr; gap: 22px;
    padding: 0 28px 40px; max-width: 1400px; margin: 0 auto;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px;
  }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  textarea, input[type=text], select, input[type=file] {
    width: 100%; background: var(--panel2); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 10px 12px; font: inherit;
  }
  textarea { min-height: 110px; resize: vertical; }
  textarea:focus, select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--text); }
  .check input { width: auto; accent-color: var(--accent); }
  button.primary {
    width: 100%; margin-top: 18px; padding: 13px;
    border: 0; border-radius: 12px; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 15px; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }
  button.primary:disabled { opacity: .55; cursor: wait; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font: inherit; cursor: pointer;
  }
  .tabs button.active { background: var(--panel2); color: var(--text); border-color: var(--accent); }
  #editInputs { display: none; }
  .drop {
    margin-top: 6px; border: 1.5px dashed var(--line); border-radius: 12px;
    padding: 14px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer;
    transition: border-color .15s;
  }
  .drop.over, .drop:hover { border-color: var(--accent); color: var(--text); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .status { margin: 16px 0 0; font-size: 13px; min-height: 18px; }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--ok); }
  .status.busy { color: var(--muted); }
  #gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px; align-content: start;
  }
  figure {
    position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden;
  }
  figure img { width: 100%; display: block; background: #000; }
  figcaption { padding: 10px 12px 12px; }
  figcaption p { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 11.5px; color: var(--muted); }
  .actions { display: flex; gap: 6px; }
  .actions a {
    color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 9px; font-size: 12px; text-decoration: none; cursor: pointer;
  }
  .actions a:hover { border-color: var(--accent); }
  .empty {
    grid-column: 1 / -1; text-align: center; color: var(--muted);
    border: 1.5px dashed var(--line); border-radius: 16px; padding: 70px 20px;
  }
  .empty strong { color: var(--text); }
  .spinner {
    display: inline-block; width: 13px; height: 13px; margin-right: 7px; vertical-align: -2px;
    border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { animation: pulse 1.4s ease-in-out infinite; background: var(--panel2); border-radius: 16px; min-height: 260px; }
  @keyframes pulse { 50% { opacity: .5; } }
</style>
</head>
<body>
<header>
  <div class="logo">N</div>
  <div>
    <h1>Nova Images</h1>
    <div class="sub">SenseNova U1 · text-to-image & image editing</div>
  </div>
</header>

<main>
  <section class="card">
    <div class="tabs">
      <button id="tabGenerate" class="active" type="button">Generate</button>
      <button id="tabEdit" type="button">Edit</button>
    </div>

    <label for="model">Model</label>
    <select id="model"></select>

    <div id="editInputs">
      <label>Source image(s)</label>
      <div class="drop" id="drop">Drop images here or click to browse — used with the instruction prompt</div>
      <input type="file" id="file" accept="image/*" multiple hidden />
      <div class="thumbs" id="thumbs"></div>
    </div>

    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="A serene Japanese garden at dusk, stone lanterns glowing, koi pond reflections, cinematic lighting"></textarea>

    <div class="grid2">
      <div>
        <label for="size">Size</label>
        <select id="size"></select>
      </div>
      <div>
        <label for="format">Format</label>
        <select id="format">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="webp">WebP</option>
        </select>
      </div>
    </div>

    <label class="check"><input type="checkbox" id="promptExtend" checked /> AI prompt rewriting (prompt_extend)</label>
    <label class="check"><input type="checkbox" id="watermark" /> Watermark</label>

    <button class="primary" id="go" type="button">Create image</button>
    <p class="status" id="status"></p>
  </section>

  <section>
    <div id="gallery">
      <div class="empty" id="empty">
        <strong>Nothing here yet.</strong><br />
        Write a prompt and press <em>Create image</em>. Results stay in this session.
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
